server:
  port: 8080

spring:
  application:
    name: market-data-persister

  rabbitmq:
    host: localhost
    port: 5672
    username: guest
    password: guest
    listener:
      simple:
        default-requeue-rejected: true

  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/rabbittick?useUnicode=true&characterEncoding=UTF-8&rewriteBatchedStatements=true
    username: root
    password: password
    hikari:
      maximum-pool-size: 30

  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        jdbc:
          batch_size: 500
          order_inserts: true

app:
  rabbitmq:
    exchange: market-data.exchange
    routing-key-ticker: "*.ticker.#"
    routing-key-trade: "*.trade.#"
    routing-key-orderbook: "*.orderbook.#"
    dlq-exchange: market-data.dlx
    dlq-queue: market-data.persist.dlq
    dlq-routing-key: market-data.persist.dlq
    retry-max-attempts: 3
    prefetch-count: 400
    orderbook-batch-size: 200

    ticker-concurrent-consumers: 4
    ticker-max-concurrent-consumers: 8

    trade-concurrent-consumers: 4
    trade-max-concurrent-consumers: 8

    orderbook-shard-count: 5
    orderbook-shard-concurrent-consumers: 20
    orderbook-shard-max-concurrent-consumers: 20

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    prometheus:
      enabled: true
  metrics:
    tags:
      application: ${spring.application.name}

logging:
  level:
    com.rabbittick.persister.messaging.MarketDataConsumer: debug
    com.rabbittick.persister.domain.orderbook.OrderBookServiceImpl: info

